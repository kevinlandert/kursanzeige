name: Kursanzeige
options:
  bundleIdPrefix: com.kevinlandert
  deploymentTarget:
    iOS: "17.0"

packages:
  KursanzeigeKit:
    path: .

targets:
  Kursanzeige:
    type: application
    platform: iOS
    supportedDestinations: [iOS]
    sources:
      - path: Kursanzeige
    dependencies:
      - package: KursanzeigeKit
    # ⌘U runs the UI tests. Xcode Cloud only archives, so they do not
    # slow the TestFlight builds.
    scheme:
      testTargets: [KursanzeigeUITests]
    info:
      path: Kursanzeige/Info.plist
      properties:
        UILaunchScreen: {}
        # Portrait and landscape: the table, the chart page and the bottom
        # bar have a layout for each.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Vorlesen goes on when the iPad locks, and the lock screen and the
        # AirPods control it.
        UIBackgroundModes: [audio]
        CFBundleDisplayName: Kursanzeige
        # Atkinson Hyperlegible Next, see Theme.font. OFL.txt next to it is
        # its license.
        UIAppFonts: [AtkinsonHyperlegibleNext-Variable.ttf]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The app uses only HTTPS, which is exempt. Without this key, each
        # TestFlight build waits for a manual export compliance answer.
        ITSAppUsesNonExemptEncryption: false
        # The large table needs the full width of the screen, so the app
        # does not take part in Split View and Slide Over.
        UIRequiresFullScreen: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kevinlandert.Kursanzeige
        MARKETING_VERSION: "1.0"
        # Xcode Cloud replaces this with its own build number (see
        # ci_scripts/ci_post_clone.sh): TestFlight refuses a number twice.
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        DEVELOPMENT_TEAM: "6Z3ZBQ6D8J"
        CODE_SIGN_STYLE: Automatic

  KursanzeigeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KursanzeigeUITests
    dependencies:
      - target: Kursanzeige
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "6.0"
        DEVELOPMENT_TEAM: "6Z3ZBQ6D8J"
        CODE_SIGN_STYLE: Automatic
